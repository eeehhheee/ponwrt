name: Publish artifact to Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID that holds the artifact'
        required: true
      artifact_name:
        description: 'Artifact name to publish'
        required: true
      tag:
        description: 'Release tag to upload to'
        required: false
        default: 'nokia-xg040g-mf-ubi'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish ${{ inputs.artifact_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download artifact from run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          set -eux
          gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[] | "\(.id) \(.name)"'
          AID=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" \
                 --jq ".artifacts[] | select(.name==\"${ARTIFACT_NAME}\") | .id")
          echo "artifact id: $AID"
          mkdir -p dist
          gh api "repos/${{ github.repository }}/actions/artifacts/${AID}/zip" > dist/artifact.zip
          ls -l dist
          (cd dist && unzip -o artifact.zip && rm artifact.zip)
          ls -l dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eux
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes "PonWrt firmware artifacts published from CI"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eux
          gh release upload "$TAG" dist/* --clobber
