name: Build Nokia XG-040G-MD UBI

on:
  workflow_dispatch:
  push:
    branches:
      - build-xg040g-md-ubi

permissions:
  contents: read

jobs:
  build:
    name: Build Nokia XG-040G-MD UBI
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git gperf help2man intltool libelf-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev \
            libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev lld \
            llvm ninja-build p7zip-full patch pkg-config pkgconf python3 \
            python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xxd zlib1g-dev zstd || \
          (echo '--- some packages unavailable, retrying individually ---'; \
           sudo apt-get install -y asciidoc autoconf automake autopoint binutils bison build-essential curl rsync zstd)

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Nokia XG-040G-MD UBI
        run: |
          cp configs/an7581.config .config
          cat configs/release.config >> .config
          cat configs/4g.config >> .config
          make defconfig
          # keep only the Nokia XG-040G-MD (UBI) device image
          sed -i \
            -e 's/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi-usb-sfp=y/# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi-usb-sfp is not set/' \
            .config
          make defconfig
          echo "==== device selection ===="
          grep -E '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_' .config

      - name: Download sources
        run: make download -j"$(nproc)" || make download -j4 -k

      - name: Build
        run: make -j"$(nproc)"

      - name: Pack firmware
        run: |
          mkdir -p release
          ls -l bin/targets/airoha/an7581/
          tar --zstd -cf release/ponwrt-an7581-nokia_xg-040g-md-ubi.tar.zst \
            -C bin/targets/airoha an7581
          (cd release && sha256sum *.tar.zst > sha256sums)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-an7581-nokia_xg-040g-md-ubi
          path: release/*
          if-no-files-found: error
          retention-days: 30
